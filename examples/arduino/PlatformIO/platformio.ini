[platformio]
default_envs = esp32s3
; This example is inside the library checkout. Keep dependencies outside it so
; PlatformIO does not mistake their headers for files owned by the parent library.
libdeps_dir = ${platformio.core_dir}/esp-wifi-config-example/libdeps

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps = ESP WiFi Config=symlink://../../..

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32]
board = esp32dev

[env:ble]
board = esp32-s3-devkitc-1
build_flags = -DWIFI_CFG_ARDUINO_PROV_BLE=1

[env:nimble]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -DWIFI_CFG_ARDUINO_PROV_BLE=1
    -DWIFI_CFG_ARDUINO_NIMBLE=1
